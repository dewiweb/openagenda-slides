<!DOCTYPE html>
<!--
  Slide QR (1920×1080) — diapo compagnon de la diapo du jour quand une
  cible est disponible (permalink OpenAgenda de l'événement, sinon page
  de l'agenda). Fond sombre assorti, QR sur cartouche blanc (lisible
  par les téléphones), logo en filigrane.
  Rempli par oaslides/today.py via string.Template — variables :
    $font_faces / $font_family  @font-face embarqués + famille CSS
    $bg                         fond (même réglage que la diapo du jour)
    $sentence                   phrase d'appel
    $target                     URL cible affichée en petit
    $qr_data                    QR code en data URI
    $logo_html                  logo de la structure (SVG inline ou <img>)
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
$font_faces
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:$font_family;color:#efeae6;
 background:#000;display:flex;flex-direction:column}
.card{position:relative;flex:1;background:$bg;border-radius:72px;
 overflow:hidden;display:flex;align-items:center;justify-content:center}
.watermark{position:absolute;z-index:0;color:rgba(239,234,230,.05)}
.watermark svg,.watermark img{display:block;width:820px;height:820px;
 object-fit:contain}
.watermark--tr{top:-260px;right:-260px}
.watermark--bl{bottom:-260px;left:-260px}
.row{position:relative;display:flex;align-items:center;gap:70px}
.qr-text{max-width:640px;font-size:46px;font-weight:500;
 line-height:1.4;color:#a8bce0;text-align:right}
.qr-text b{color:#eef3fb;font-weight:500}
.qr-url{margin-top:28px;font-size:26px;color:#6f80ab;word-break:break-all}
.arrow{flex:0 0 auto;align-self:flex-end;margin:0 -60px -40px -110px;
 color:#a8bce0}
.arrow svg{display:block;width:260px;height:auto}
.qrbox{flex:0 0 auto;background:#fff;border-radius:36px;
 padding:36px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.qrbox img{display:block;width:400px;height:400px}

</style></head><body>
<div class="card">
  <div class="watermark watermark--tr">$logo_html</div>
  <div class="watermark watermark--bl">$logo_html</div>
  <div class="row">
    <div class="qr-text">$sentence
      <div class="qr-url">$target</div>
    </div>
    <div class="arrow"><svg viewBox="0 0 120 90" fill="none"
      stroke="currentColor" stroke-width="5" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M8 12 C 45 10, 90 28, 104 66"/>
      <path d="M88 62 L 106 70 L 102 50"/>
    </svg></div>
    <div class="qrbox"><img src="$qr_data" alt="QR code"></div>
  </div>
</div>
</body></html>
