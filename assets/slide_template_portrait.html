<!DOCTYPE html>
<!--
  ==========================================================================
  Gabarit de diapo « événement » — PORTRAIT A4 (1240×1754, ratio 1:√2)
  ==========================================================================
  Même charte que slide_template.html (paysage), composition verticale :
  visuel en haut, puis titre, description, specs ; pied de page en bas à
  droite. Pensée pour l'impression A4 (2480×3508 = 300 dpi en UHD).

  Rempli par oaslides/slide.py via string.Template — mêmes variables que
  le gabarit paysage (voir l'en-tête de slide_template.html). Charte
  commune : slide_base.css ; ce fichier = métriques + composition verticale.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
$font_faces
@import "slide_base.css";

/* ===== Métriques propres au format A4 portrait ========================== */
:root {
    --card-radius: 64px;
    --card-pad: 46px 48px;
    --card-gap: 38px;

    --wm-size: 700px;
    --wm-offset: -220px;

    --photo-pos: center 28%;   /* recadre vers le haut (visages) */
    --photo-radius: 44px;

    --tag-inset: 24px;
    --tag-pad: 12px 34px;
    --tag-size: 30px;

    --credit-inset: 20px;
    --credit-size: 16px;
    --credit-maxw: 340px;
    --credit-pad: 5px 14px;

    --h1-lines: 5;
    --desc-size: 32px;
    --desc-lh: 1.4;
    --desc-mt: 28px;
    --desc-lines: 7;
    --desc-maxw: none;

    --specs-gap: 20px;
    --specs-gap-tight: 15px;
    --specs-pad-bottom: 64px;  /* décolle les specs du pied de page */
    --spec-size: 36px;
    --spec-size-tight: 31px;
    --spec-gap: 16px;
    --spec-icon: 40px;

    --attrib-size: 21px;
    --attrib-right: 38px;
    --attrib-bottom: 26px;
    --attrib-gap: 12px;
    --attrib-b-size: 28px;
    --attrib-b-pad: 10px 26px;

    /* surcharges de l'onglet Style de l'app (vide = défauts) */
    $style_overrides
}

/* ===== Composition verticale : visuel en haut, contenu dessous ========== */

html, body {
    width: 1240px;
    height: 1754px;
    overflow: hidden;
}

/* Bloc visuel : hauteur fixe, la photo le remplit (base CSS). */
.photo-block {
    position: relative;
    flex: 0 0 780px;
}

/* Zone texte : occupe le reste ; specs poussées en bas (margin-top:auto). */
.content {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 14px;
    min-height: 0;
}
</style></head><body>
<div class="card">
  <div class="watermark watermark--tr">$logo_html</div>
  <div class="watermark watermark--bl">$logo_html</div>
  <div class="photo-block">
    $media
    <span class="tag">$tag</span>
  </div>
  <div class="content">
    <h1 style="font-size:${h1_size}px">$title</h1>
    <p class="desc">$desc</p>
    <div class="$specs_cls">$specs_html</div>
  </div>
  <div class="attrib">$footer_html</div>
</div>
</body></html>
