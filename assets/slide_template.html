<!DOCTYPE html>
<!--
  Gabarit de diapo oaslides (1920×1080, ratio 16:9).
  Rempli par oaslides/slide.py via string.Template — variables :
    $font_faces / $font_family  @font-face embarqués + famille CSS
    $bg / $dark                 fond de la carte + variante foncée
    $ink                        couleur d'encre (#141414)
    $media                      bloc visuel : <img> ou placeholder SVG
    $tag                        pastille catégorie
    $h1_size                    taille du titre selon sa longueur
    $title / $desc              titre / description (échappés HTML)
    $specs_cls / $specs_html    liste des specs (date, durée, lieu…)
    $logo_html                  logo de la structure (SVG inline ou <img>)
    $footer_html                ligne de pied de page (lien programme)
  Le rendu s'ouvre dans un navigateur : tout est embarqué (fontes,
  images en data URI) — fichier autonome.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
$font_faces
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:$font_family;color:$ink;
 background:#000;display:flex;flex-direction:column}
.card{position:relative;flex:1;background:$bg;border-radius:72px;
 overflow:hidden;display:flex;flex-direction:column}
.watermark{position:absolute;z-index:0;color:rgba(255,255,255,.35)}
.watermark svg,.watermark img{display:block;width:820px;height:820px;
 object-fit:contain}
.watermark--tr{top:-260px;right:-260px}
.watermark--bl{bottom:-260px;left:-260px}
main{position:relative;flex:1;display:flex;gap:70px;padding:54px 64px;
 min-height:0}
.left{flex:0 0 780px;position:relative;min-height:0}
.photo{position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;border-radius:48px;display:block;background:$dark}
.photo--empty{display:block}
.photo--empty>svg{position:absolute;inset:0;width:100%;height:100%}
.ph-logo{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;color:rgba(20,20,20,.75)}
.ph-logo svg,.ph-logo img{width:52%;height:auto}
.tag{position:absolute;left:32px;bottom:32px;z-index:2;background:#fff;
 border-radius:2em;padding:12px 36px;font-size:31px;font-weight:500;
 box-shadow:0 10px 34px rgba(20,20,20,.14)}
.credit{position:absolute;right:24px;bottom:24px;z-index:2;font-size:18px;
 line-height:1.3;max-width:420px;text-align:right;color:#fff;
 background:rgba(20,20,20,.45);border-radius:1.2em;padding:5px 16px}
.right{flex:1;display:flex;flex-direction:column;padding:40px 0;
 min-height:0}
h1{font-size:80px;font-weight:500;line-height:1.06;letter-spacing:-.01em;
 display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
 overflow:hidden}
.desc{font-size:34px;line-height:1.38;color:rgba(20,20,20,.78);
 margin-top:36px;max-width:860px;display:-webkit-box;
 -webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.specs{margin-top:auto;display:flex;flex-direction:column;gap:26px}
.specs--tight{gap:16px}
.specs--tight .spec{font-size:33px}
.spec{display:flex;align-items:center;gap:18px;font-size:38px;
 font-weight:500}
.spec svg{flex:0 0 auto}
.attrib{position:absolute;right:44px;bottom:30px;font-size:21px;
 color:rgba(20,20,20,.45);display:flex;align-items:center;gap:14px}
.attrib b{font-size:28px;font-weight:500;color:#efeae6;
 background:#555555;border-radius:2em;padding:10px 28px}
</style></head><body>
<div class="card">
<div class="watermark watermark--tr">$logo_html</div>
<div class="watermark watermark--bl">$logo_html</div>
<main>
  <div class="left">
    $media
    <span class="tag">$tag</span>
  </div>
  <div class="right">
    <h1 style="font-size:${h1_size}px">$title</h1>
    <p class="desc">$desc</p>
    <div class="$specs_cls">$specs_html</div>
  </div>
</main>
<div class="attrib">$footer_html</div>
</div>
</body></html>
