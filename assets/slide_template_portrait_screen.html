<!DOCTYPE html>
<!--
  ==========================================================================
  Gabarit de diapo « événement » — PORTRAIT ÉCRAN 9:16 (1080×1920)
  ==========================================================================
  Même charte que slide_template.html ; pensé pour un écran 16:9 monté en
  vertical (totem). Composition identique à la variante A4, métriques
  adaptées au ratio plus élancé (visuel plus haut, textes plus resserrés).

  Rempli par oaslides/slide.py via string.Template — mêmes variables que
  le gabarit paysage (voir l'en-tête de slide_template.html). Charte
  commune : slide_base.css ; ce fichier = métriques + composition verticale.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
$font_faces
@import "slide_base.css";

/* ===== Métriques propres au format 9:16 ================================= */
:root {
    --card-radius: 56px;
    --card-pad: 42px 44px;
    --card-gap: 34px;

    --wm-size: 620px;
    --wm-offset: -200px;

    --photo-pos: center 28%;
    --photo-radius: 40px;

    --tag-inset: 22px;
    --tag-pad: 11px 30px;
    --tag-size: 27px;

    --credit-inset: 18px;
    --credit-size: 15px;
    --credit-maxw: 320px;
    --credit-pad: 5px 13px;

    --h1-lines: 6;
    --desc-size: 32px;
    --desc-lh: 1.45;
    --desc-mt: 30px;
    --desc-lines: 9;
    --desc-maxw: none;

    --specs-gap: 18px;
    --specs-gap-tight: 14px;
    --specs-pad-bottom: 64px;
    --spec-size: 33px;
    --spec-size-tight: 29px;
    --spec-gap: 15px;
    --spec-icon: 36px;

    --attrib-size: 19px;
    --attrib-right: 34px;
    --attrib-bottom: 24px;
    --attrib-gap: 11px;
    --attrib-b-size: 25px;
    --attrib-b-pad: 9px 24px;
}

/* ===== Composition verticale : visuel en haut, contenu dessous ========== */

html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
}

.photo-block {
    position: relative;
    flex: 0 0 880px;
}

.content {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 10px;
    min-height: 0;
}
</style></head><body>
<div class="card">
  <div class="watermark watermark--tr">$logo_html</div>
  <div class="watermark watermark--bl">$logo_html</div>
  <div class="photo-block">
    $media
    <span class="tag">$tag</span>
  </div>
  <div class="content">
    <h1 style="font-size:${h1_size}px">$title</h1>
    <p class="desc">$desc</p>
    <div class="$specs_cls">$specs_html</div>
  </div>
  <div class="attrib">$footer_html</div>
</div>
</body></html>
